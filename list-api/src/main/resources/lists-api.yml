openapi: 3.1.2
info:
  title: Packlist Lists API
  description: API for managing lists and templates
  version: 1.0.0
security:
  - bearerAuth: [ ]
paths:
  /api/templates:
    get:
      operationId: getTemplates
      tags:
        - template
      responses:
        200:
          description: List of all created templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TemplateDto'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createTemplate
      tags:
        - template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateCreateDto'
      responses:
        201:
          description: Template created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateDto'
        default:
          $ref: '#/components/responses/Problem'
  /api/lists:
    post:
      operationId: createList
      tags:
        - list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListCreateDto'
      responses:
        201:
          description: List created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDto'
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Problem:
      description: Problem details
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetailsDto'
  schemas:
    TemplateDto:
      additionalProperties: false
      allOf:
        - $ref: '#/components/schemas/TemplateTagDto'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/TemplateItemDto'
    TemplatePreviewDto:
      additionalProperties: false
      allOf:
        - $ref: '#/components/schemas/TemplateTagDto'
        - type: object
          properties:
            ownItemsCount:
              type: integer
              readOnly: true
            inheritedItemsCount:
              type: integer
              readOnly: true
            inherits:
              type: array
              items:
                $ref: '#/components/schemas/TemplateTagDto'
    TemplateCreateDto:
      type: object
      required:
        - name
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        icon:
          type: string
          minLength: 1
          maxLength: 255
        items:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 255
    TemplateTagDto:
      type: object
      additionalProperties: false
      required:
        - templateId
        - name
      properties:
        templateId:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 255
          readOnly: true
        icon:
          type: string
          minLength: 1
          maxLength: 255
    TemplateItemDto:
      type: object
      additionalProperties: false
      properties:
        templateItemId:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 255
    ListDto:
      type: object
    ListCreateDto:
      type: object
    ProblemDetailsDto:
      type: object
      required:
        - status
        - title
      properties:
        type:
          type: string
          readOnly: true
        title:
          type: string
          readOnly: true
        status:
          type: integer
          readOnly: true
        detail:
          type: string
          readOnly: true
        fields:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ProblemDetailsFieldDto'
    ProblemDetailsFieldDto:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          readOnly: true
        params:
          type: object
          additionalProperties: true
          readOnly: true