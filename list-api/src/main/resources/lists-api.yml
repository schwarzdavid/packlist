openapi: 3.1.2
info:
  title: Packlist Lists API
  description: API for managing lists and templates
  version: 1.0.0
security:
  - bearerAuth: [ ]
paths:
  /api/templates:
    get:
      # TODO: add pagination
      operationId: getTemplates
      tags:
        - template
      responses:
        200:
          description: List of all created templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TemplatePreviewDto'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createTemplate
      tags:
        - template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateCreateDto'
      responses:
        201:
          description: Template created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateDto'
        default:
          $ref: '#/components/responses/Problem'
  /api/templates/{templateId}:
    parameters:
      - in: path
        name: templateId
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    get:
      operationId: getTemplate
      tags:
        - template
      security:
        - bearerAuth: [ ]
      responses:
        200:
          description: Template retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateDto'
        404:
          description: Template not found or current user does not have access to it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsDto'
        default:
          $ref: '#/components/responses/Problem'
  /api/templates/{templateId}/items:
    parameters:
      - in: path
        name: templateId
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    post:
      operationId: addTemplateItem
      tags:
        - template-item
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateItemEditDto'
      responses:
        201:
          description: Item created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateDto'
        default:
          $ref: '#/components/responses/Problem'
  /api/lists:
    post:
      operationId: createList
      tags:
        - list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListCreateDto'
      responses:
        201:
          description: List created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDto'
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Problem:
      $ref: '../../../../backend-common/problem-api.yml#/components/responses/Problem'
  schemas:
    TemplateDto:
      additionalProperties: false
      allOf:
        - $ref: '#/components/schemas/TemplateTagDto'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/TemplateItemDto'
    TemplatePreviewDto:
      additionalProperties: false
      allOf:
        - $ref: '#/components/schemas/TemplateTagDto'
        - type: object
          required:
            - itemsCount
          properties:
            itemsCount:
              type: integer
              readOnly: true
    TemplateCreateDto:
      type: object
      required:
        - name
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        icon:
          type: string
          minLength: 1
          maxLength: 255
        items:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 255
    TemplateTagDto:
      type: object
      additionalProperties: false
      required:
        - templateId
        - name
      properties:
        templateId:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 255
          readOnly: true
        icon:
          type: string
          minLength: 1
          maxLength: 255
    TemplateItemDto:
      additionalProperties: false
      allOf:
        - $ref: '#/components/schemas/TemplateItemEditDto'
        - type: object
          required:
            - templateItemId
          properties:
            templateItemId:
              type: integer
              format: int64
              readOnly: true
    TemplateItemEditDto:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^\S(.*\S)?$'
    ListDto:
      type: object
    ListCreateDto:
      type: object
    ProblemDetailsDto:
      $ref: '../../../../backend-common/problem-api.yml#/components/schemas/ProblemDetailsDto'