packages:
  - frontend-app
  - user-client-ts
  - list-client-ts
  - e2e
allowBuilds:
  '@parcel/watcher': true
  cpu-features: false
  esbuild: true
  protobufjs: false
  ssh2: false
  vue-demi: set this to true or false
includeWorkspaceRoot: true
minimumReleaseAgeExclude:
  - '@schwarzdavid/ui-kit@0.0.1-alpha.19 || 0.0.1-alpha.20'
tasks:
  dev:
    dependsOn:
      - ^generate
  build:
    dependsOn:
      - ^generate