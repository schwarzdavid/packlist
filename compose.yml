name: packlist

services:
  postgres-user:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${USER_POSTGRES_DB:-users}
      POSTGRES_USER: ${USER_POSTGRES_USER:-users}
      POSTGRES_PASSWORD: ${USER_POSTGRES_PASSWORD:-users}
    ports:
      # Bound to localhost only; override the host port with POSTGRES_PORT if 5432 is taken.
      - "127.0.0.1:${USER_POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/<major>/docker,
      # so the volume is mounted at the parent directory (not .../data as in 17 and older).
      - postgres-user-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipes -d recipes"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-user-data:
