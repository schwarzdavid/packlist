user-service:
  auth:
    password:
      strength: 10
    jwt:
      secret: random-secret
      ttl_sec: 2678400 # 1 month

spring:
  flyway:
    enabled: true
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/users
    username: users
    password: users
  jpa:
    hibernate:
      ddl-auto: validate
server:
  port: 8881
