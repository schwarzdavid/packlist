user-service:
  auth:
    password:
      strength: 10
    jwt:
      secret: ${JWT_SECRET:random-secret-with-atleast-256-bytes} # TODO: remove default value
      ttl: 31d

spring:
  flyway:
    enabled: true
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${USER_POSTGRES_HOST:localhost}:${USER_POSTGRES_PORT:5432}/${USER_POSTGRES_DB:users}
    username: ${USER_POSTGRES_USER:users}
    password: ${USER_POSTGRES_PASSWORD:users}
  jpa:
    hibernate:
      ddl-auto: validate

logging:
  level:
    org.springframework.boot.test.context.cache: DEBUG
    org.springframework.security: DEBUG

server:
  port: 8881

management:
  server:
    port: 8882
    address: 127.0.0.1
