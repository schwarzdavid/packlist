user-service:
  auth:
    password:
      strength: 10
    jwt:
      private-key: ${JWT_PRIVATE_KEY_PATH:classpath:keys/private.pem}
      public-key: ${JWT_PUBLIC_KEY_PATH:classpath:keys/public.pem}
      ttl: 31d
      issuer: ${JWT_ISSUER_URL:http://localhost:8881}

spring:
  application:
    name: user-service
  flyway:
    enabled: true
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${USER_POSTGRES_HOST:localhost}:${USER_POSTGRES_PORT:8889}/${USER_POSTGRES_DB:users}
    username: ${USER_POSTGRES_USER:users}
    password: ${USER_POSTGRES_PASSWORD:users}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

logging:
  level:
    org.springframework.boot.test.context.cache: DEBUG
    org.springframework.security: DEBUG

server:
  port: 8881

management:
  server:
    port: 8882
    address: 127.0.0.1
