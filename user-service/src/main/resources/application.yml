user-service:
  auth:
    password:
      strength: 10
    jwt:
      secret: ${JWT_SECRET:random-secret}
      ttl_sec: 2678400 # 1 month

spring:
  flyway:
    enabled: true
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${USER_POSTGRES_HOST:localhost}:${USER_POSTGRES_PORT:5432}/${USER_POSTGRES_DB}
    username: ${USER_POSTGRES_USER:users}
    password: ${USER_POSTGRES_PASSWORD:users}
  jpa:
    hibernate:
      ddl-auto: validate

logging:
  level:
    org.springframework.boot.test.context.cache: DEBUG
    org.springframework.security: DEBUG

server:
  port: 8881
