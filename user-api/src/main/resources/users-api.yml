openapi: 3.0.0
info:
  title: Packlist Users API
  description: API for managing users and authentication
  version: 1.0.0
paths:
  /api/users:
    post:
      security:
        - bearerAuth: [ ]
      description: Create a new user
      tags:
        - user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateDto'
      responses:
        201:
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'

components:
  securitySchemes:
    bearerAuth:
      name: Frontend Auth
      description: Bearer token authentication
      type: apiKey
      in: header
      scheme: bearer
      bearerFormat: JWT
  schemas:
    UserCreateDto:
      type: object
      additionalProperties: false
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 8
    UserDto:
      type: object
      additionalProperties: false
      required:
        - userId
        - username
        - email
      properties:
        userId:
          type: integer
          minimum: 1
          readOnly: true
        username:
          type: string
          minLength: 1
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255