openapi: 3.1.2
info:
  title: Packlist Users API
  description: API for managing users and authentication
  version: 1.0.0
paths:
  /api/users:
    post:
      operationId: createUser
      security:
        - bearerAuth: [ ]
      description: Create a new user
      tags:
        - user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/user/UserCreateDto'
      responses:
        201:
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/user/UserDto'
  /api/auth/login:
    post:
      operationId: login
      description: Perform login attempt using email/username and password
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/auth/CredentialsDto'
      responses:
        200:
          description: User logged in successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/auth/AuthDto'
  /api/auth/register:
    post:
      operationId: register
      description: Register a new user
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/auth/RegistrationDto'
      responses:
        201:
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/auth/AuthDto'
        409:
          $ref: '#/components/responses/Problem'
          description: User with the same username or email already exists
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Problem:
      description: Problem details
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/error/ProblemDetails'
  schemas:
    user:
      UserCreateDto:
        type: object
        additionalProperties: false
        required:
          - username
          - email
          - password
        properties:
          username:
            type: string
            minLength: 1
            maxLength: 255
          email:
            type: string
            format: email
            maxLength: 255
          password:
            type: string
            minLength: 8
      UserDto:
        type: object
        additionalProperties: false
        required:
          - userId
          - username
          - email
        properties:
          userId:
            type: integer
            format: int64
            minimum: 1
            readOnly: true
          username:
            type: string
            minLength: 1
            maxLength: 255
            pattern: '^[^@]*$'
          email:
            type: string
            format: email
            maxLength: 255
    auth:
      CredentialsDto:
        type: object
        additionalProperties: false
        required:
          - identifier
          - password
        properties:
          identifier:
            type: string
            minLength: 1
            maxLength: 255
          password:
            type: string
            minLength: 1
      RegistrationDto:
        type: object
        additionalProperties: false
        required:
          - username
          - email
          - password
        properties:
          username:
            type: string
            minLength: 1
            maxLength: 255
            pattern: '^[^@]*$'
          email:
            type: string
            format: email
            maxLength: 255
            minLength: 1
          password:
            type: string
            minLength: 8
      AuthDto:
        type: object
        additionalProperties: false
        required:
          - userId
          - token
          - user
        properties:
          userId:
            type: integer
            format: int64
            minimum: 1
            readOnly: true
          token:
            type: string
            readOnly: true
          user:
            $ref: '#/components/schemas/user/UserDto'
    error:
      ProblemDetails:
        type: object
        required:
          - status
          - title
        properties:
          type:
            type: string
            readOnly: true
          title:
            type: string
            readOnly: true
          status:
            type: integer
            readOnly: true
          detail:
            type: string
            readOnly: true
          fields:
            type: object
            additionalProperties:
              $ref: '#/components/schemas/error/ProblemDetailsField'
      ProblemDetailsField:
        type: object
        required:
          - path
        properties:
          error:
            type: string
            readOnly: true
          params:
            type: object
            additionalProperties: true
            readOnly: true
