openapi: 3.1.2
info:
  title: Packlist Users API
  description: API for managing users and authentication
  version: 1.0.0
paths:
  /api/users/me:
    get:
      operationId: getCurrentUser
      security:
        - bearerAuth: [ ]
      description: Get current user
      tags:
        - user
      responses:
        200:
          description: User retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        default:
          $ref: '#/components/responses/Problem'
  /api/auth/login:
    post:
      operationId: login
      description: Perform login attempt using email/username and password
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialsDto'
      responses:
        200:
          description: User logged in successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthDto'
  /api/auth/register:
    post:
      operationId: register
      description: Register a new user
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationDto'
      responses:
        201:
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthDto'
        409:
          $ref: '#/components/responses/Problem'
          description: User with the same username or email already exists
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Problem:
      $ref: '../../../../backend-common/problem-api.yml#/components/responses/Problem'
  schemas:
    UserCreateDto:
      type: object
      additionalProperties: false
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 8
    UserDto:
      type: object
      additionalProperties: false
      required:
        - userId
        - username
        - email
      properties:
        userId:
          type: integer
          format: int64
          minimum: 1
          readOnly: true
        username:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[^@]*$'
        email:
          type: string
          format: email
          maxLength: 255
    CredentialsDto:
      type: object
      additionalProperties: false
      required:
        - identifier
        - password
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 255
        password:
          type: string
          minLength: 1
    RegistrationDto:
      type: object
      additionalProperties: false
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[^@]*$'
        email:
          type: string
          format: email
          maxLength: 255
          minLength: 1
        password:
          type: string
          minLength: 8
    AuthDto:
      type: object
      additionalProperties: false
      required:
        - userId
        - token
        - user
      properties:
        userId:
          type: integer
          format: int64
          minimum: 1
          readOnly: true
        token:
          type: string
          readOnly: true
        user:
          $ref: '#/components/schemas/UserDto'
    ProblemDetailsDto:
      $ref: '../../../../backend-common/problem-api.yml#/components/schemas/ProblemDetailsDto'
